# Install as /etc/nginx/sites-available/smartify and enable in sites-enabled.
# Copy the contents of Flutter's build/web/ into /var/www/smartify/.
server {
    listen 0.0.0.0:8080;
    server_name _;

    root /var/www/smartify;
    index index.html;

    location /api/ {
        # The trailing slash strips /api/ before forwarding to Flask.
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
